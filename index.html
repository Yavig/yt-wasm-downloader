    // ----------------------------------------------------------------

    // Convierte Base‑64 → ArrayBuffer (la librería base64‑arraybuffer ya está cargada)
    async function base64ToAb(b64){ return base64ToArrayBuffer(b64); }

    async function getWasmBuffer(){
      const cache = await caches.open(WASM_CACHE);
      const cached = await cache.match(WASM_NAME);
      if (cached) return cached.arrayBuffer();

      const binary = await base64ToAb(WASM_BASE64);
      const response = new Response(binary,{headers:{'Content-Type':'application/wasm'}});
      await cache.put(WASM_NAME, response.clone());
      return binary;
    }

    // ============================================================
    // 3️⃣ Instanciar Go + WASM
    // ============================================================
    (async () => {
      const go = new Go();
      const wasmBytes = await getWasmBuffer();
      const {instance} = await WebAssembly.instantiate(wasmBytes, go.importObject);
      go.run(instance);               // exporta `wasmGetInfo`
      // Cuando el WASM esté listo, intentamos iniciar la descarga automática
      autoDownloadIfParam();
    })();
  </script>

  <!-- 4️⃣ Lógica de descarga automática -->
  <script>
    // Detectar navegadores controlados por WebDriver (bots) y abortar
    if (navigator.webdriver) {
      document.getElementById('status').textContent = '⚠️ Navegador detectado como bot – operación abortada';
    }

    function getParam(name){
      return new URLSearchParams(location.search).get(name);
    }

    async function autoDownloadIfParam(){
      if (navigator.webdriver) return;               // no descargar en bots
      const videoUrl = getParam('url');
      if (!videoUrl) return;                         // nada que hacer

      // Esperamos a que `wasmGetInfo` esté disponible
      while (typeof wasmGetInfo !== 'function') await new Promise(r=>setTimeout(r,100));

      try{
        const data = JSON.parse(wasmGetInfo(videoUrl));
        if (data.error) throw new Error(data.error);
        const a = document.createElement('a');
        a.href = data.stream;
        a.download = `${data.title}.mp4`;
        a.click();
        document.getElementById('status').textContent = '✅ Descarga iniciada';
      }catch(e){
        document.getElementById('status').textContent = '❌ '+e.message;
      }
    }
  </script>

  <!-- 5️⃣ Service Worker (caché de la página completa) -->
  <script>
    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('service-worker.js')
        .then(()=> console.log('SW registrado'))
        .catch(console.error);
